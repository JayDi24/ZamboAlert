; ==== zamboalert-pod/platformio.ini ====

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    ; BLEDevice/BLEScan are part of the ESP32 Arduino core (built in with
    ; framework = arduino on an esp32dev board) - no separate lib_deps entry needed.
