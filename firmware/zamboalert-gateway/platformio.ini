; ==== zamboalert-gateway/platformio.ini ====

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    knolleary/PubSubClient @ ^2.8
    ; WiFi.h and HTTPClient.h are part of the ESP32 Arduino core - no
    ; separate lib_deps entry needed for those.
